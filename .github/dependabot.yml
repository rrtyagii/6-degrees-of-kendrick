version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      website-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      website-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /maintenance
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      maintenance-compatible:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      maintenance-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
      other-actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action/*"]
